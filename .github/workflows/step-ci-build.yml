# Caching
#
# Gradle (gradle/actions/setup-gradle in .github/actions/shared-build-setup):
#   gradle-home-v1|<os>|<job>[...]-<sha>
#       Per-job Gradle User Home state. A new entry per run, since cache entries can't be
#       updated in place; the next run restores the newest one for the same job and OS.
#   gradle-dependencies-v1-<hash>, gradle-transforms-v1-<hash>, gradle-wrapper-zips-v1-<hash>
#       The bulky content, keyed by content hash and shared between jobs. New entries only
#       when dependencies or the Gradle version change.
#   Only the default branch writes these (setup-gradle's default); PRs restore them.
#   Test jobs deliberately keep writing too: a read-only job restores another job's entry
#   and re-downloads whatever that lacks (test dependencies, macOS/Windows), which is the
#   Maven Central traffic that gets us rate limited.
#
# Test Maven repos (actions/cache, "cache test maven repo" steps):
#   jbang-test-m2-it-<os>-<hash>      integration tests   ${{ runner.temp }}/jbang-test-m2
#   jbang-test-m2-native-<os>-<hash>  native image ITs    ${{ runner.temp }}/jbang-test-m2
#   jbang-test-m2-smoke-<os>-<hash>   smoke tests         ${{ runner.temp }}/jbang-test-m2
#                                                         + ~/.m2/repository
#   The repo jbang resolves into during tests (_JBANG_TEST_REPO / JBANG_REPO), so test runs
#   don't download the same artifacts from Maven Central every time (HTTP 429). <hash>
#   covers itests/, src/it/ and src/main/resources/ (templates); restore-keys start from
#   the previous entry, so a change only downloads the delta.
#   One key per job type: an entry is immutable and only the first job to save a key wins,
#   so with a shared key the smoke tests' artifacts (Quarkus) were never saved. Jobs of the
#   same type resolve the same artifacts, so their race doesn't matter.
#   Smoke tests also cache ~/.m2/repository because Quarkus' build integration (qcli
#   template) resolves its deployment artifacts with its own resolver into the default
#   Maven repo, not into JBANG_REPO.
#
# All caches share the repository's 10 GB limit and are evicted least recently used first.

name: step-ci-build
on:
  workflow_dispatch:
    inputs: &inputs
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        type: boolean
        default: false
      debug_detached:
        description: 'Run tmate debugging in detached mode'
        required: false
        type: boolean
        default: true
      skip_tests:
        description: 'Skip all test jobs (tests, integration tests, smoke tests)'
        required: false
        type: boolean
        default: false
      skip_jreleaser_dry_run:
        description: 'Skip JReleaser dry-run (e.g. when called from release workflow)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs: *inputs


jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      - uses: $/.github/actions/shared-build-setup
      - name: check formatting and comment on PR if failed
        id: check-formatting
        run: ./gradlew --no-daemon formatCheck

  build-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      - id: shared-build
        uses: $/.github/actions/shared-build-setup
      - name: build-with-no-tests
        run: ./gradlew --no-daemon clean build installDist publish -x check --build-cache --scan -s
      - name: Upload jbang.zip
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ${{ steps.shared-build.outputs.github-short-sha }}-shared-build-jbang
          path: build/install/jbang
      - name: Upload build results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name:  ${{ steps.shared-build.outputs.github-short-sha }}-shared-build
          path: build

  build-test-native-image:
    needs: build-shared
    strategy:
      fail-fast: false
      matrix:
        os: &os_matrix [ubuntu-latest,windows-latest,macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      - id: shared-build
        uses: $/.github/actions/shared-build-setup
      - name: setup-graalvm
        uses: graalvm/setup-graalvm@v1.5.3
        with:
            java-version: '25'      
            distribution: 'graalvm-community' # like to use mandrel but using community for now
            github-token: ${{ secrets.GITHUB_TOKEN }}
            set-java-home: false # we should not use graalvm for java builds (we need java 11)
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ steps.shared-build.outputs.github-short-sha }}-shared-build
          path: build
      - name: build-native-image
        run: |
          ./gradlew --no-daemon nativeImage
      - name: ensure native image is executable
        run: |
            chmod -v +x build/native-image/jbang.bin*
      - name: upload-native-image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.shared-build.outputs.github-short-sha }}-jbang.bin-${{ matrix.os }}
          path: build/native-image/*
          if-no-files-found: error

      - name: build-native-bundles
        run: |
          ./gradlew --no-daemon nativeDistZip nativeDistTar latestNativeDistZip latestNativeDistTar

      - name: upload-native-bundles
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.shared-build.outputs.github-short-sha }}-jbang-native-bundles-${{ matrix.os }}
          path: |
            build/distributions/*-${{ runner.os == 'macOS' && 'mac' || runner.os == 'Windows' && 'windows' || 'linux' }}-*.zip
            build/distributions/*-${{ runner.os == 'macOS' && 'mac' || runner.os == 'Windows' && 'windows' || 'linux' }}-*.tar
          if-no-files-found: error
      
      - name: cache test maven repo
        if: ${{ !inputs.skip_tests }}
        # see "Caching" at the top of this file
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/jbang-test-m2
          key: jbang-test-m2-native-${{ runner.os }}-${{ hashFiles('itests/**', 'src/it/**', 'src/main/resources/**') }}
          restore-keys: |
            jbang-test-m2-native-${{ runner.os }}-
      - name: create install with native binary
        if: ${{ !inputs.skip_tests }}
        run: |
          ./gradlew --no-daemon cleanInstallDist installDist
      - name: integration-test-native-image
        if: ${{ !inputs.skip_tests }}
        env:
          JBANG_USE_NATIVE: true
          _JBANG_TEST_REPO: ${{ runner.temp }}/jbang-test-m2
        run: |
          ./gradlew --no-daemon integrationTest
      - name: Arcive test results
        if: ${{ !inputs.skip_tests && always() }}
        uses: $/.github/actions/shared-test-archiving
        with:
          prefix: ${{ steps.shared-build.outputs.github-short-sha }}-test-native-image-
          suffix: -${{matrix.os}}
      - name: Archive build results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ${{ steps.shared-build.outputs.github-short-sha }}-test-native-image-build-${{ matrix.os }}
          path: build

 
  unit-test-jvm:
    if: ${{ !inputs.skip_tests }}
    needs: build-shared
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        java-version: [11]
        os: *os_matrix
        include: &latest_jdks
          - os: ubuntu-latest
            java-version: latest
            setup-java: latest
          # bump manually until setup-java supports 'latest-ea'
          # (https://github.com/actions/setup-java/issues/1328)
          - os: ubuntu-latest
            java-version: ea
            setup-java: '28-ea'
            experimental: true
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      # Installed before shared-build-setup so JAVA_HOME (and thus Gradle) stays on the build JDK
      - id: test-jdk
        if: matrix.setup-java
        uses: actions/setup-java@v6.3.0
        with:
          java-version: ${{ matrix.setup-java }}
          distribution: temurin
      - id: test-jdk-major
        if: matrix.setup-java
        shell: bash
        run: |
          v="${{ steps.test-jdk.outputs.version }}"
          echo "major=${v%%[.+-]*}" >> "$GITHUB_OUTPUT"
      - id: shared-build
        uses: $/.github/actions/shared-build-setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ steps.shared-build.outputs.github-short-sha }}-shared-build
          path: build
      - name: test
        run: |
          ./gradlew --no-daemon test -PtestJavaVersion=${{ steps.test-jdk-major.outputs.major || matrix.java-version }} ${{ steps.test-jdk.outputs.path && format('-Porg.gradle.java.installations.paths={0}', steps.test-jdk.outputs.path) || '' }}
      - name: Add artifact.ci links
        if: failure()
        shell: bash
        run: |
          SHA="${{ steps.shared-build.outputs.github-short-sha }}"
          ARTIFACT="${SHA}-unit-test-jvm-allure-report-${{ matrix.os }}-${{ matrix.java-version }}"
          BASE="https://www.artifact.ci/artifact/view/${{ github.repository }}/run/${{ github.run_id }}.${{ github.run_attempt }}"
          REPORT_URL="${BASE}/${ARTIFACT}/index.html"
          echo "### Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "1. **First** open the [artifact.ci report page](${BASE}/${ARTIFACT}) to activate it" >> $GITHUB_STEP_SUMMARY
          echo "2. Then use the direct links below" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Full Report](${REPORT_URL})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Emit per-test deep links for failed tests
          if [ -d build/allure-results ]; then
            echo "#### Failed Tests" >> $GITHUB_STEP_SUMMARY
            for f in build/allure-results/*-result.json; do
              [ -f "$f" ] || continue
              status=$(python3 -c "import json; d=json.load(open('$f')); print(d.get('status',''))" 2>/dev/null)
              if [ "$status" = "failed" ] || [ "$status" = "broken" ]; then
                info=$(python3 -c "import json; d=json.load(open('$f')); print(d.get('fullName','unknown') + ' ' + d.get('uuid',''))" 2>/dev/null)
                name=$(echo "$info" | awk '{print $1}')
                uuid=$(echo "$info" | awk '{print $2}')
                if [ -n "$uuid" ]; then
                  echo "- ❌ [${name}](${REPORT_URL}#testresult/${uuid})" >> $GITHUB_STEP_SUMMARY
                fi
              fi
            done
          fi
      - name: Arcive test results
        uses: $/.github/actions/shared-test-archiving
        if: always()
        with:
          prefix: ${{ steps.shared-build.outputs.github-short-sha }}-unit-test-jvm-
          suffix: -${{matrix.os}}-${{ matrix.java-version }}
      - name: Archive build results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ${{ steps.shared-build.outputs.github-short-sha }}-unit-test-jvm-build-${{ matrix.os }}-${{ matrix.java-version }}
          path: build
      - name: Write out Unit Test report annotation for forked repo
        if: failure()
        uses: mikepenz/action-junit-report@v6.4.1
        with:
          report_paths: 'build/test-results/test/TEST-*.xml'
          annotate_only: true # forked repo cannot write to checks so just do annotations

  integration-test-jvm:
    if: ${{ !inputs.skip_tests }}
    needs: build-shared
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java-version: [8,11,17,21,25]
        os: *os_matrix
        exclude: 
            # Windows should only run Java 11 and 25
            - os: windows-latest
              java-version: 8
            - os: windows-latest
              java-version: 17
            - os: windows-latest
              java-version: 21

            # macOS should only run Java 11 and 25
            - os: macos-latest
              java-version: 8
            - os: macos-latest
              java-version: 17
            - os: macos-latest
              java-version: 21
        include:
          # ubuntu-26.04 runners no longer ship JDK 8, so install it here rather than
          # have the tests download it from foojay during setup (flaky: corrupt gzip)
          - java-version: 8
            setup-java: '8'
          - os: ubuntu-latest
            java-version: latest
            setup-java: latest
          - os: ubuntu-latest
            java-version: ea
            setup-java: '28-ea'
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    name: integration-tests
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      # Installed before shared-build-setup so JAVA_HOME (and thus Gradle) stays on the build JDK
      - id: test-jdk
        if: matrix.setup-java
        uses: actions/setup-java@v6.3.0
        with:
          java-version: ${{ matrix.setup-java }}
          distribution: temurin
      - id: test-jdk-major
        if: matrix.setup-java
        shell: bash
        run: |
          v="${{ steps.test-jdk.outputs.version }}"
          echo "major=${v%%[.+-]*}" >> "$GITHUB_OUTPUT"
      - id: shared-build
        uses: $/.github/actions/shared-build-setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ steps.shared-build.outputs.github-short-sha }}-shared-build
          path: build
      - name: cache test maven repo
        # see "Caching" at the top of this file
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/jbang-test-m2
          key: jbang-test-m2-it-${{ runner.os }}-${{ hashFiles('itests/**', 'src/it/**', 'src/main/resources/**') }}
          restore-keys: |
            jbang-test-m2-it-${{ runner.os }}-
      - name: integration-test
        env:
          _JBANG_TEST_REPO: ${{ runner.temp }}/jbang-test-m2
          _JBANG_TEST_JAVA_VERSION: ${{ steps.test-jdk-major.outputs.major || matrix.java-version }}
          _JBANG_TEST_JAVA_HOME: ${{ steps.test-jdk.outputs.path }}
        run: |
          ./gradlew --no-daemon integrationTest
      - name: Add artifact.ci links
        if: failure()
        shell: bash
        run: |
          SHA="${{ steps.shared-build.outputs.github-short-sha }}"
          ARTIFACT="${SHA}-integration-test-jvm-allure-report-${{ matrix.os }}-${{ matrix.java-version }}"
          BASE="https://www.artifact.ci/artifact/view/${{ github.repository }}/run/${{ github.run_id }}.${{ github.run_attempt }}"
          REPORT_URL="${BASE}/${ARTIFACT}/index.html"
          echo "### Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "1. **First** open the [artifact.ci report page](${BASE}/${ARTIFACT}) to activate it" >> $GITHUB_STEP_SUMMARY
          echo "2. Then use the direct links below" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Full Report](${REPORT_URL})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Emit per-test deep links for failed tests
          if [ -d build/allure-results ]; then
            echo "#### Failed Tests" >> $GITHUB_STEP_SUMMARY
            for f in build/allure-results/*-result.json; do
              [ -f "$f" ] || continue
              status=$(python3 -c "import json; d=json.load(open('$f')); print(d.get('status',''))" 2>/dev/null)
              if [ "$status" = "failed" ] || [ "$status" = "broken" ]; then
                info=$(python3 -c "import json; d=json.load(open('$f')); print(d.get('fullName','unknown') + ' ' + d.get('uuid',''))" 2>/dev/null)
                name=$(echo "$info" | awk '{print $1}')
                uuid=$(echo "$info" | awk '{print $2}')
                if [ -n "$uuid" ]; then
                  echo "- ❌ [${name}](${REPORT_URL}#testresult/${uuid})" >> $GITHUB_STEP_SUMMARY
                fi
              fi
            done
          fi
      - name: Arcive test results
        uses: $/.github/actions/shared-test-archiving
        if: always()
        with:
          prefix: ${{ steps.shared-build.outputs.github-short-sha }}-integration-test-jvm-
          suffix: -${{matrix.os}}-${{ matrix.java-version }}
      - name: Archive build results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ${{ steps.shared-build.outputs.github-short-sha }}-integration-test-jvm-build-${{ matrix.os }}-${{ matrix.java-version }}
          path: build
      - name: Write out Unit Test report annotation for forked repo
        if: failure()
        uses: mikepenz/action-junit-report@v6.4.1
        with:
          report_paths: 'build/test-results/integrationTest/TEST-*.xml'
          annotate_only: true # forked repo cannot write to checks so just do annotations

  smoke-test:
    if: ${{ !inputs.skip_tests }}
    needs: build-shared
    strategy:
      ## disable fail-fast so on variance failing don't fail the rest
      #fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [8,11,17,21,25]
    runs-on: ${{ matrix.os }}
    env:
      _JBANG_: ./build/install/jbang/bin/jbang
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      - id: shared-build
        uses: $/.github/actions/shared-build-setup
        with:
          add-job-summary: 'never'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ steps.shared-build.outputs.github-short-sha }}-shared-build
          path: build
      - name: cache test maven repo
        # see "Caching" at the top of this file
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ runner.temp }}/jbang-test-m2
            ~/.m2/repository
          key: jbang-test-m2-smoke-${{ runner.os }}-${{ hashFiles('itests/**', 'src/it/**', 'src/main/resources/**') }}
          restore-keys: |
            jbang-test-m2-smoke-${{ runner.os }}-
      - name: use cached test maven repo
        run: echo "JBANG_REPO=${{ runner.temp }}/jbang-test-m2" >> "$GITHUB_ENV"
      - name: smoke-test
        run: |
          java -version
          chmod +x $_JBANG_
          $_JBANG_ init --template=cli helloworld.java
          $_JBANG_ --verbose helloworld.java
          rm helloworld.java
      - name: smoke-quarkus-test
        run: |
          java -version
          chmod +x $_JBANG_
          $_JBANG_ init --template=qcli qcli.java
          $_JBANG_ --fresh --verbose qcli.java
          rm qcli.java
      - name: smoke-quarkus-diff-version-test
        run: |
          java -version
          chmod +x $_JBANG_
          $_JBANG_ init --template=qcli qcli.java
          $_JBANG_ --fresh --verbose --java 17 qcli.java
          rm qcli.java
      - name: integration-test-non-windows
        if: runner.os != 'Windows'
        run: |
          export PATH=`pwd`/build/install/jbang/bin:$PATH
          cd build/itests
          chmod +x ./test_suite.sh
          ./test_suite.sh

  jreleaser-dry-run:
    needs: [build-shared, build-test-native-image]
    if: always() && needs.build-shared.result == 'success' && !inputs.skip_jreleaser_dry_run
    runs-on: ubuntu-latest
    env:
      JRELEASER_SECRETS_HINT: ${{ secrets.JRELEASER_SECRETS_HINT }}
      JRELEASER_VERSION: early-access
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      - id: shared-build
        uses: $/.github/actions/shared-build-setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ steps.shared-build.outputs.github-short-sha }}-shared-build
          path: build
      - name: Download native bundles
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ steps.shared-build.outputs.github-short-sha }}-jbang-native-bundles-*
          path: build/distributions
          merge-multiple: true
          if-no-files-found: warn
      - name: version extract
        id: version
        run: |
          RELEASE_VERSION=`cat build/tmp/version.txt`
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $RELEASE_VERSION"
          ls -la build/distributions
      - name: Run JReleaser (dry-run)
        uses: jreleaser/release-action@97b5e2f0e845de2fe1dbbdf451ac6a21233fafff # v2
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.RELEASE_VERSION }}
          JRELEASER_GITHUB_TOKEN: unused-dry-run
        with:
          version: ${{ env.JRELEASER_VERSION }}
          arguments: release --dry-run --yolo
          setup-java: false
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ${{ steps.shared-build.outputs.github-short-sha }}-jreleaser-release-artifacts
          path: out/jreleaser/

  merge-test-reports:
    if: always() && !inputs.skip_tests
    needs: [unit-test-jvm, integration-test-jvm, build-test-native-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      - id: shared-build
        uses: $/.github/actions/shared-build-setup
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ steps.shared-build.outputs.github-short-sha }}-*-allure-results-*
          path: build/allure-inputs
      - name: Configure Allure multi-dir input
        # Gradle reads ORG_GRADLE_PROJECT_* env vars as -P project properties,
        # so shared-test-archiving's internal `gradle allureReport` will use
        # all per-OS launch dirs instead of the (non-existent) build/allure-results.
        run: |
          if [ -d build/allure-inputs ] && [ -n "$(find build/allure-inputs -mindepth 1 -maxdepth 1 -type d)" ]; then
            DIRS=$(find build/allure-inputs -mindepth 1 -maxdepth 1 -type d | tr '\n' ',' | sed 's/,$//')
          else
            echo "::warning::No allure-inputs artifacts found; skipping merge"
            DIRS=""
          fi
          echo "ORG_GRADLE_PROJECT_allureMergeDirs=$DIRS" >> $GITHUB_ENV
          echo "ALLURE_MERGE_DIRS=$DIRS" >> $GITHUB_ENV
      - name: Archive test results
        if: env.ALLURE_MERGE_DIRS != ''
        uses: $/.github/actions/shared-test-archiving
        with:
          prefix: ${{ steps.shared-build.outputs.github-short-sha }}-merged-allurereport-
          suffix: ""

  test-results-summary:
    if: always() && !inputs.skip_tests
    needs: [merge-test-reports]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      - id: shared-build
        uses: $/.github/actions/shared-build-setup
      - name: Create test results summary
        run: |
          SHA_PREFIX="${{ steps.shared-build.outputs.github-short-sha }}"
          BASE="https://www.artifact.ci/artifact/view/${{ github.repository }}/run/${{ github.run_id }}.${{ github.run_attempt}}/${SHA_PREFIX}"
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🧪 Test Results Summary

          ## 📊 Combined Reports (All Tests Merged)

          - **Merged Allure Report**: [artifact.ci](${BASE}-merged-allurereport-allure-report) | [direct](${BASE}-merged-allurereport-allure-report/index.html) - All unit and integration tests across all platforms

          ## 🖥️ Unit Test Reports (by Platform)

          - **Ubuntu Latest**: [artifact.ci](${BASE}-unit-test-jvm-allure-report-ubuntu-latest) | [direct](${BASE}-unit-test-jvm-allure-report-ubuntu-latest/index.html)
          - **macOS Latest**: [artifact.ci](${BASE}-unit-test-jvm-allure-report-macos-latest) | [direct](${BASE}-unit-test-jvm-allure-report-macos-latest/index.html)
          - **Windows Latest**: [artifact.ci](${BASE}-unit-test-jvm-allure-report-windows-latest) | [direct](${BASE}-unit-test-jvm-allure-report-windows-latest/index.html)

          ## 🔧 Integration Test Reports (by Platform)

          ### Ubuntu
