name: Shared Build Setup
description: Setup the build environment for the shared build commands

inputs:
  add-job-summary:
    description: Add the job summary to the output
    required: false
    default: 'never'
  java-version:
    description: The Java version to use
    required: false
    default: '25'
outputs:
  github-short-sha:
    description: The short github.sha
    value: ${{ steps.git-short-sha.outputs.github-short-sha }}
runs:
  using: 'composite'
  steps:
    - name: Set short git commit SHA
      shell: bash
      id: git-short-sha
      run: |
        calculatedSha=$(git rev-parse --short ${{ github.sha }})
        echo "github-short-sha=$calculatedSha" >> $GITHUB_OUTPUT
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin
    # Caches the Gradle User Home; see "Caching" in .github/workflows/step-ci-build.yml.
    # Defaults we rely on: cache-read-only (only the default branch writes, PRs restore)
    # and cache-cleanup: on-success (stale files are removed before saving).
    - name: setup-gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      with:
          # restore even if the runner already has a Gradle User Home
          cache-overwrite-existing: true
          add-job-summary: ${{ inputs.add-job-summary }}
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled }}
      with:
        limit-access-to-actor: true
        detached: ${{ github.event.inputs.debug_detached }}